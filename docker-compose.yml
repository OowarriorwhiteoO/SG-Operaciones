services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SGW_SA_PASSWORD:?Configure SGW_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  web:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=SistemaGestion;User Id=sa;Password=${SGW_SA_PASSWORD};TrustServerCertificate=True"
      # El correo y la contraseña se inyectan al iniciar; no existen valores predeterminados publicables.
      SGW_ADMIN_EMAIL: "${SGW_ADMIN_EMAIL:?Configure SGW_ADMIN_EMAIL}"
      SGW_ADMIN_PASSWORD: "${SGW_ADMIN_PASSWORD:?Configure SGW_ADMIN_PASSWORD}"
      System__TimeZoneId: "${SGW_TIMEZONE:-Pacific SA Standard Time}"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sql-data:
